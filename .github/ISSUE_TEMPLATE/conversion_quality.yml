name: Conversion quality
description: The conversion finished, but the output does not look right
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time. Everything on this page is public: please do not attach private documents. Describe them instead, or build a small file that shows the same problem.
  - type: textarea
    id: what
    attributes:
      label: What looks wrong?
      description: >-
        For example lost or broken tables, wrong column order, broken lists, OCR mistakes, missing
        images, headers or footers in the body text.
    validations:
      required: true
  - type: input
    id: pages
    attributes:
      label: Pages affected
      placeholder: e.g. 3, 7-9
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: >-
        Filled in automatically when you come from the app. Otherwise please give the version (page
        footer), the tool and your browser.
      render: text
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: >-
        Filled in automatically by the app from the conversion report: statistics, warnings and
        settings, never the file or its name.
      render: text
  - type: textarea
    id: sample
    attributes:
      label: Sample file
      description: >-
        Drag a file into this box to attach it. Only attach files you may share publicly; a small
        synthetic file that reproduces the problem is best.
