name: Feature request · 功能建议
description: Suggest an improvement · 想要一个新功能或改进
labels: [enhancement]
body:
  - type: textarea
    id: what
    attributes:
      label: What would you like? · 想要什么？
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why is it useful? · 为什么有用？
      description: The situation where you would use it. · 你会在什么场景用到它。
