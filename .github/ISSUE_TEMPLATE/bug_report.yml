name: Bug report
description: Something failed or behaved wrongly
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time. Everything on this page is public: please do not attach private documents. Describe them instead, or build a small file that shows the same problem.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: >-
        Filled in automatically when you come from the app. Otherwise please give the version (page
        footer), the tool and your browser.
      render: text
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: >-
        Filled in automatically by the app: the error, settings and file statistics, never the file
        or its name.
      render: text
  - type: textarea
    id: sample
    attributes:
      label: Sample file
      description: >-
        Drag a file into this box to attach it. Only attach files you may share publicly; a small
        synthetic file that reproduces the problem is best.
