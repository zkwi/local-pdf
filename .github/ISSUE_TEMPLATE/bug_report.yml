name: Bug report · 问题反馈
description: Something failed or behaved wrongly · 转换失败，或者行为不对
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time. Everything on this page is public: please do not attach private documents. Describe them instead, or build a small file that shows the same problem.

        感谢反馈。这个页面是公开的，请不要附上私密文件；可以描述文件的特征，或者做一个能复现问题的小样本。
  - type: textarea
    id: what
    attributes:
      label: What happened? · 发生了什么？
      description: What you did, what you expected, and what happened instead. · 做了什么、期望是什么、实际是什么。
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment · 环境
      description: >-
        Filled in automatically when you come from the app. Otherwise please give the version (page
        footer), the tool and your browser. · 从应用里点「反馈」进来会自动填好；否则请写版本（页脚）、工具和浏览器。
      render: text
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics · 诊断信息
      description: >-
        Filled in automatically by the app: the error, settings and file statistics, never the file
        or its name. · 由应用自动填写：错误信息、设置和文件统计，不含文件本身和文件名。
      render: text
  - type: textarea
    id: sample
    attributes:
      label: Sample file · 样本文件
      description: >-
        Drag a file into this box to attach it. Only attach files you may share publicly; a small
        synthetic file that reproduces the problem is best. · 把文件拖进这个框就能附上。只附可以公开的文件，最好是能复现问题的小样本。
